name: tabular-data-modelling-pipeline
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python>=3.10
  # Core
  - numpy
  - pandas>=1.3.0
  - scipy>=1.11
  - scikit-learn>=1.3
  - statsmodels>=0.14
  # Gradient boosting
  - catboost>=1.2
  - py-xgboost>=2.0
  # Visualisation
  - matplotlib>=3.7
  - seaborn>=0.13
  - plotly>=5.18
  # Tuning
  - optuna>=3.0
  # Deep learning (CPU build; for GPU swap to pytorch::pytorch + cudatoolkit)
  - pytorch::pytorch>=2.0
  # Dev
  - pytest>=7.4
  - pytest-cov>=4.1
  - pip
  - pip:
      # Pip-only packages
      - tabm
      - captum>=0.7
      - shap>=0.44
      - openml>=0.14
      - kaggle>=1.6
