name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install core + GBM + DL + viz + dev extras
        # Skip [interp] (Captum/SHAP) and [tuning] (Optuna) on CI - they're
        # heavy and the test suite doesn't require them. The pipeline degrades
        # gracefully when they're missing.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gbm,dl,viz,dev]"

      - name: Run pytest
        run: pytest tests/ -v --tb=short
