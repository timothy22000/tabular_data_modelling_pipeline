[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-data-modelling-pipeline"
version = "0.1.0"
description = "8-architecture tabular modelling pipeline (CatBoost, XGBoost, CANN, FT-Transformer, TabM, CANN-GBM, LocalGLMnet, DRN) with Optuna tuning, ensembling, and interpretability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Tim Mun"},
]
keywords = [
    "tabular",
    "deep-learning",
    "gradient-boosting",
    "actuarial",
    "glm",
    "cann",
    "ft-transformer",
    "tabm",
    "drn",
    "ensemble",
    "interpretability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies - always required.
dependencies = [
    "numpy",
    "pandas>=1.3.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
# Gradient-boosted machine architectures (CatBoost, XGBoost, CANN-GBM)
gbm = ["catboost>=1.2", "xgboost>=2.0"]

# Deep learning architectures (CANN, FT-Transformer, TabM, LocalGLMnet, DRN)
dl = ["torch>=2.0", "tabm"]

# Hyperparameter tuning
tuning = ["optuna>=3.0"]

# Interpretability (Captum attributions, SHAP, partial dependence)
interp = ["captum>=0.7", "shap>=0.44"]

# Visualisation and HTML dashboards
viz = ["matplotlib>=3.7", "seaborn>=0.13", "plotly>=5.18"]

# Dataset download helpers (OpenML, UCI direct URL, Kaggle API)
download = ["openml>=0.14", "requests>=2.31", "kaggle>=1.6"]

# Development - tests + linting
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

# Everything in one shot
all = [
    "catboost>=1.2",
    "xgboost>=2.0",
    "torch>=2.0",
    "tabm",
    "optuna>=3.0",
    "captum>=0.7",
    "shap>=0.44",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "plotly>=5.18",
    "openml>=0.14",
    "requests>=2.31",
    "kaggle>=1.6",
]

[project.scripts]
tabmodel-train = "modelling:main"

[tool.setuptools]
py-modules = ["dataset_config"]

[tool.setuptools.packages.find]
include = ["modelling*", "configs*"]
exclude = ["tests*", "results*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
